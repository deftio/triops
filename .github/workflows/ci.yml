name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor, a common shared-hosting version, and current. If it passes on
        # 8.0 it will not have picked up 8.1+ syntax by accident.
        php: ['8.0', '8.2', '8.4']

    name: php ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none

      - name: Lint every PHP file
        # The highest-value check in this repo. 0.1 shipped a page beginning
        # "<? php" that emitted its whole body as text; this would have caught
        # it on the first push.
        run: |
          status=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::syntax error"; php -l "$f"; status=1; }
          done < <(find app dev -name '*.php')
          echo "linted $(find app dev -name '*.php' | wc -l) files"
          exit $status

      - name: Site assets and version have not drifted
        # pages/ carries its own copies so it is just a directory of static
        # files GitHub can serve directly — no build step, no staging, no
        # deploy workflow. The cost of that is two copies, so check them here
        # rather than building machinery to avoid the duplication.
        run: |
          status=0
          for f in bitwrench.umd.min.js triops.js; do
            if ! diff -q "app/assets/$f" "pages/assets/$f" > /dev/null; then
              echo "::error::pages/assets/$f differs from app/assets/$f — copy it across"
              status=1
            fi
          done
          version=$(php -r "require 'app/lib/triops.php'; echo TRIOPS_VERSION;")
          if ! grep -q "version: \"$version\"" pages/assets/version.js; then
            echo "::error::pages/assets/version.js does not say $version"
            status=1
          fi

          # Docs that print what an endpoint returns have to print the current
          # version, or the first thing a reader compares against reality is
          # already wrong. Two releases running, these were fixed by hand.
          for f in docs/api.md app/api/version.php; do
            if ! grep -q "$version" "$f"; then
              echo "::error file=$f::shows a version other than $version — update the example output"
              status=1
            fi
          done

          [ $status -eq 0 ] && echo "site assets match app/, version $version"
          exit $status

      - name: Renderer matches the published TACO schema
        # The allowlist exists in two places by necessity: JSON Schema is what
        # other people validate against, and the browser cannot read it without
        # a fetch triops does not want to make. So diff them here instead —
        # a renderer laxer than its own published schema is worse than no schema.
        run: php dev/check-taco-tags.php

      - name: TACO sanitiser rejects hostile documents
        # The one place a device's bytes become UI rather than text on a page,
        # so the one place getting it wrong is more than a display bug.
        run: node dev/check-taco-sanitizer.mjs

      - name: Smoke test
        run: ./dev/smoke.sh

      - name: Smoke test with the ndjson driver
        # The fallback path has to work on hosts with no sqlite extension, so
        # exercise it explicitly rather than trusting auto-detection.
        #
        # STORE, not a config.php written here: smoke.sh writes that file itself
        # to redirect data_dir, so a driver set this way was silently discarded
        # and this job spent its life testing sqlite a second time.
        run: STORE=ndjson PORT=8798 ./dev/smoke.sh

  no-sqlite:
    # Prove triops still runs when the sqlite extension is simply absent, which
    # is the situation the ndjson driver exists for.
    runs-on: ubuntu-latest
    name: php 8.2 without sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ':sqlite3'
          coverage: none
      - name: Confirm sqlite3 really is absent
        # Block scalar, not an inline one: an unquoted "? 1 : 0" contains " : "
        # and YAML parses that as a mapping, silently breaking the file.
        run: |
          if php -r 'exit(class_exists("SQLite3") ? 1 : 0);'; then
            echo "sqlite3 absent as intended"
          else
            echo "::error::sqlite3 is still loaded; this job is not testing what it claims"
            exit 1
          fi

      - name: Smoke test on the ndjson fallback
        run: PORT=8797 ./dev/smoke.sh
