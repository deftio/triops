<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triops — see what your hardware is actually sending</title>
<meta name="description" content="A small PHP web server for inspecting what IoT hardware sends over HTTP. Unzip into a web directory and it runs: no framework, no Composer packages, no build step.">
<meta property="og:title" content="triops — see what your hardware is actually sending">
<meta property="og:description" content="Raw bytes, headers and timing from an ESP32, a Pi, anything with HTTP. Unzip into a web directory and it runs.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deftio.github.io/triops/pages/">
<meta property="og:image" content="https://deftio.github.io/triops/pages/assets/social-card.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="A triops inbox entry: request headers with the ingest key redacted, and a binary payload shown as a hex dump.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="triops — see what your hardware is actually sending">
<meta name="twitter:description" content="Raw bytes, headers and timing from an ESP32, a Pi, anything with HTTP. Unzip into a web directory and it runs.">
<meta name="twitter:image" content="https://deftio.github.io/triops/pages/assets/social-card.png">
<link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
<!-- Plain files, committed alongside this page. bitwrench and triops.js are
     copies of the ones in app/assets/; CI checks they have not drifted. -->
<script src="./assets/bitwrench.umd.min.js"></script>
<script src="./assets/triops.js"></script>
<script src="./assets/version.js"></script>
</head>
<body>

<!--
  Visible fallback. Everything below is replaced once bitwrench renders, so if
  you are reading this in a browser then assets/bitwrench.umd.min.js did not
  load and the page would otherwise be silently blank.
-->
<div id="app">
  <noscript><p>This page needs JavaScript. The project itself does not.</p></noscript>
</div>

<script>
if (typeof bw === 'undefined') {
  document.getElementById('app').innerHTML =
    '<div style="font:16px system-ui;max-width:34rem;margin:3rem auto;padding:1rem;' +
    'border:1px solid #cc6633;border-radius:6px">' +
    '<h1 style="margin-top:0">triops</h1>' +
    '<p>The UI failed to load — <code>assets/bitwrench.umd.min.js</code> is missing.</p>' +
    '<p>Check that <code>pages/assets/</code> was published alongside this page.</p>' +
    '<p><a href="https://github.com/deftio/triops">github.com/deftio/triops</a></p></div>';
  throw new Error('bitwrench failed to load');
}
</script>

<script>
triops.baseStyles({ primary: '#006666', secondary: '#cc6633' });

// Generated by dev/build-site.sh from TRIOPS_VERSION — never hand-edited here.
var SITE = window.TRIOPS_SITE || { version: 'dev', bitwrench: '?', repo: 'https://github.com/deftio/triops' };
var REPO = SITE.repo;

function section(children, style) {
  return { t: 'section', a: { class: 'bw_container', style: style || 'padding:2rem 0' }, c: children };
}

function code(text) {
  return {
    t: 'pre',
    a: { class: 'bw_bccl_card', style: 'padding:0.9rem;overflow-x:auto;font-size:0.85rem;margin:0.75rem 0' },
    c: text
  };
}

/**
 * A link that looks like a button.
 *
 * NOT bw.makeButton — that ignores href entirely and always renders a
 * <button>, so the navigation silently does nothing. And not an onclick
 * either: these go to other pages, so they should be real anchors that
 * middle-click, open-in-new-tab and keyboard navigation all understand.
 */
function linkButton(text, href, variant) {
  return {
    t: 'a',
    a: {
      href: href,
      class: 'bw_bccl_btn bw_' + (variant || 'primary'),
      style: 'text-decoration:none;display:inline-block'
    },
    c: text
  };
}

bw.DOM('#app', { t: 'div', c: [

  // ---- hero
  section([
    { t: 'img', a: { src: './assets/triops-logo.png', alt: 'triops', style: 'height:84px' } },
    { t: 'h1', a: { style: 'margin:1rem 0 0.5rem' }, c: 'See what your hardware is actually sending.' },
    { t: 'div', a: { style: 'opacity:0.7;font-size:0.9rem;margin-bottom:0.5rem' },
      c: 'version ' + SITE.version + '  ·  PHP 8.0+  ·  no build step' },
    { t: 'p', a: { class: 'triops-prose', style: 'font-size:1.1rem;opacity:0.85' },
      c: 'A small web server for the other end of your device\'s HTTP connection. ' +
         'Unzip it into a web directory and it runs — no framework, no Composer packages, no database server, no build system.' },
    { t: 'div', a: { style: 'display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1.2rem' }, c: [
      linkButton('Try the demo', './demo/', 'primary'),
      linkButton('GitHub', REPO, 'secondary'),
      linkButton('Docs', './docs/', 'secondary')
    ]}
  ], 'padding:3rem 0 1rem'),

  // ---- the problem
  section([
    { t: 'h2', c: 'The problem' },
    { t: 'p', a: { class: 'triops-prose' }, c: 'You have a board on your desk. The firmware posts a sensor reading somewhere. ' +
                 'It is not arriving, or it is arriving wrong, and you cannot tell whether the problem is ' +
                 'the WiFi, the HTTP client, the JSON encoder, a Content-Type header nobody set, or a ' +
                 'payload that got truncated at 512 bytes.' },
    { t: 'p', a: { class: 'triops-prose' }, c: 'triops is the other end of that connection. Point the board at it and it shows you the ' +
                 'bytes it received, the headers that came with them, and when they arrived.' },
    code('$ curl -X POST \'http://192.168.1.40/triops/api/ingest.php?channel=lab\' \\\n' +
         '       -H \'Content-Type: application/json\' \\\n' +
         '       -d \'{"device":"esp32-01","temp_c":22.4}\'\n\n' +
         '{"ok":true,"api":1,"data":{"channel":"lab","bytes":35,"stored":true}}'),
    { t: 'p', a: { style: 'opacity:0.8' }, c: '…and it is on screen, parsed, with the raw bytes one click away.' }
  ]),

  // ---- where it fits
  section([
    { t: 'h2', c: 'Where it fits' },
    { t: 'p', c: 'Somewhere between blinking an LED and having a real backend.' },
    { t: 'p', a: { class: 'triops-prose' }, c: 'Early on you are not testing your telemetry pipeline, you are testing whether the board ' +
                 'can form a correct HTTP request at all. Standing up a real service to find that out is a ' +
                 'detour, and pointing the board at a cloud endpoint means the failure is now somewhere in ' +
                 'someone else\'s logs. What you want is a target on your own network that answers ' +
                 'immediately and hides nothing.' },
    { t: 'p', a: { class: 'triops-prose' }, c: 'It runs on a Raspberry Pi, a NAS, an old laptop, or whatever shared host you already pay ' +
                 'for. It works on a lab network with no internet connection. Nothing leaves your machine.' },
    bw.makeCard({
      title: 'It is not a production backend',
      content: 'No clustering, no retention policy, no alerting, no TLS termination, no multi-tenancy. ' +
               'It keeps the last few hundred payloads per channel and drops the rest. When you outgrow it ' +
               'you are supposed to outgrow it — by then you know exactly what your device sends, which was ' +
               'the point.'
    })
  ]),

  // ---- what you get
  section([
    { t: 'h2', c: 'What you get' },
    { t: 'p', a: { class: 'triops-prose' }, c: 'The debug endpoints return plain text, deliberately. A device with a 2 KB HTTP client ' +
                 'should not have to parse JSON to find out whether its clock is right.' },
    bw.makeDataTable({
      data: [
        { endpoint: 'echo.php',        does: 'Your whole request played back: method, headers, query, body' },
        { endpoint: 'bytes.php?n=4096', does: 'Exactly N bytes — find your receive buffer limit' },
        { endpoint: 'delay.php?ms=2000', does: 'Answers slowly — test client timeouts' },
        { endpoint: 'code.php?c=500',  does: 'Any status you ask for — test error paths' },
        { endpoint: 'timestamp.php',   does: 'Server time to microseconds' },
        { endpoint: 'api/ingest.php',  does: 'POST anything. The canonical device endpoint' },
        { endpoint: 'view.php',        does: 'The inbox, newest first, parsed with a raw toggle' }
      ]
    })
  ]),

  // ---- install
  section([
    { t: 'h2', c: 'Install' },
    { t: 'p', c: 'Four steps, and none of them is "edit a config file".' },
    code('cd /var/www/html\n' +
         'curl -LO ' + REPO + '/releases/latest/download/triops.zip\n' +
         'unzip triops.zip\n' +
         'chmod u+w triops/data'),
    { t: 'p', c: 'Open it in a browser, create your account, point your device at api/ingest.php, ' +
                 'and watch it arrive.' },
    { t: 'p', a: { style: 'opacity:0.8' },
      c: 'Requires PHP 8.0 or newer and a writable directory. SQLite is used when available and a plain ' +
         'append-only text file when it is not, so there is nothing to install either way.' }
  ]),

  // ---- built with
  section([
    { t: 'h2', c: 'Built with bitwrench' },
    { t: 'p', c: [
      'This page and the whole triops interface are built with ',
      { t: 'a', a: { href: 'https://github.com/deftio/bitwrench' }, c: 'bitwrench' },
      ' — a zero-dependency UI library that builds pages from plain JavaScript objects with no build ' +
      'step. That is why triops has a copy vendored and still works on a network with no internet.'
    ]},
    { t: 'p', a: { style: 'opacity:0.8' },
      c: 'triops is a reasonable worked example if you want to see what a whole small app looks like: ' +
         'auth, forms, tables, charts and dark mode in about 1500 lines.' }
  ]),

  { t: 'footer', a: { class: 'bw_container', style: 'padding:2rem 0 3rem;opacity:0.7;font-size:0.9rem' },
    c: [
      { t: 'div', c: [
        { t: 'strong', c: 'triops ' + SITE.version },
        { t: 'span', c: '  ·  ' },
        { t: 'a', a: { href: REPO + '/releases/tag/v' + SITE.version }, c: 'release notes' },
        { t: 'span', c: '  ·  ' },
        { t: 'a', a: { href: REPO + '/releases/latest/download/triops.zip' }, c: 'download' },
        { t: 'span', c: '  ·  built with bitwrench ' + SITE.bitwrench }
      ]},
      { t: 'div', a: { style: 'margin-top:0.6rem' }, c: [
        { t: 'a', a: { href: '#', onclick: function (e) { e.preventDefault(); bw.toggleThemeMode(); } }, c: 'light / dark' },
        { t: 'span', c: '  ·  BSD 2-clause  ·  © 2020–2026 M A Chatterjee  ·  ' },
        { t: 'a', a: { href: REPO }, c: 'source' }
      ]}
    ]}
]});
</script>
</body>
</html>
