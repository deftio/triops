<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triops demo</title>
<meta name="description" content="An interactive mock of the triops interface. No server, no data leaves your browser.">
<meta property="og:title" content="triops demo — an interactive mock">
<meta property="og:description" content="Click through the triops interface with canned payloads. No server, no data leaves your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deftio.github.io/triops/pages/demo/">
<meta property="og:image" content="https://deftio.github.io/triops/pages/assets/social-card.png">
<meta property="og:image:alt" content="A triops inbox entry: request headers with the ingest key redacted, and a binary payload shown as a hex dump.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://deftio.github.io/triops/pages/assets/social-card.png">
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<script src="../assets/bitwrench.umd.min.js"></script>
<script src="../assets/triops.js"></script>
<script src="../assets/version.js"></script>
</head>
<body>

<!--
  This is a MOCK.

  GitHub Pages serves static files and cannot run PHP, so there is no triops
  here — the login accepts anything, the payloads are canned, and nothing is
  stored or transmitted. It exists so you can see the interface before
  installing.

  It loads the same bitwrench and the same app/assets/triops.js as the real
  thing, and mirrors the real pages, so it cannot drift far from what you
  actually get.

  Navigation is hash-based (#view, #send, #status) so the links are real URLs
  and the back button works. makeNavbar items carry only text/href/active —
  an onclick on an item is not passed through.
-->

<div id="app"></div>
<script>
triops.baseStyles({ primary: '#006666', secondary: '#cc6633' });

var SITE = window.TRIOPS_SITE || { version: 'dev', bitwrench: '?', repo: 'https://github.com/deftio/triops' };
var REPO = SITE.repo;

var loggedIn = false;
var timer = null;

// Canned payloads, shaped like things a board actually sends: well-formed JSON,
// a bare sensor reading, form encoding, one that is malformed on purpose, and
// one that is not text at all — because those are the cases a viewer has to
// handle honestly, and they are the reason to use triops rather than a log line.
//
// `enc` mirrors the body_encoding field the real API returns. A base64 entry is
// a body that was not valid UTF-8; the viewer renders it as a hex dump.
var SAMPLES = [
  { body: '{"device":"esp32-01","temp_c":22.4,"humidity":41,"uptime_s":1043,"wifi":{"rssi":-58,"ssid":"lab"}}' },
  { body: '{"device":"esp32-01","temp_c":22.6,"humidity":41,"uptime_s":1048,"wifi":{"rssi":-61,"ssid":"lab"}}' },
  { body: '23.1', ctype: 'text/plain' },
  { body: 'qlUBEGVzcDMyLTAxAA4BYP/SPJE=', enc: 'base64', bytes: 20, ctype: 'application/octet-stream' },
  { body: '{"device":"pico-w-02","readings":[1.2,3.4,5.6],"battery_v":3.71}' },
  { body: '{"device":"esp32-01","temp_c":22.9,"uptime_s":1058,' },
  { body: 'sensor=temp&value=22.4&id=esp32-01', ctype: 'application/x-www-form-urlencoded' }
];

var entries = [];
var seq = 0;

function addEntry(sample) {
  if (sample == null) { sample = SAMPLES[seq % SAMPLES.length]; seq++; }

  // Keep the header consistent with whatever the payload claims to be.
  var device = sample.body.indexOf('pico') > -1 ? 'pico-w-02' : 'esp32-01';

  entries.unshift({
    ts: Date.now() / 1000,
    ip: '192.168.1.' + (50 + (seq % 4)),
    method: 'POST',
    ctype: sample.ctype || 'application/json',
    bytes: sample.bytes || sample.body.length,
    query: { channel: 'lab' },
    // Recorded exactly as the real thing records them, redaction included: the
    // ingest key is sent by the device and never written down.
    headers: {
      'Host': '192.168.1.40',
      'User-Agent': 'ESP32HTTPClient',
      'Content-Type': sample.ctype || 'application/json',
      'Content-Length': String(sample.bytes || sample.body.length),
      'X-Device-Id': device,
      'X-Triops-Key': '[redacted]'
    },
    body: sample.body,
    body_encoding: sample.enc || 'utf-8'
  });
  if (entries.length > 12) entries.pop();
}

for (var i = 0; i < 4; i++) addEntry();

// ---------------------------------------------------------------- chrome

function banner() {
  return {
    t: 'div',
    a: { style: 'background:#cc6633;color:#fff;padding:0.55rem 1rem;text-align:center;font-size:0.9rem' },
    c: [
      { t: 'strong', c: 'Demo. ' },
      { t: 'span', c: 'Nothing here is real — the data is canned and there is no server. ' },
      { t: 'a', a: { href: REPO, style: 'color:#fff;text-decoration:underline' }, c: 'Install the real thing' }
    ]
  };
}

function currentRoute() {
  var h = (window.location.hash || '#view').replace('#', '');
  return ['view', 'send', 'status'].indexOf(h) > -1 ? h : 'view';
}

function shell(route, body) {
  return { t: 'div', c: [
    banner(),
    bw.makeNavbar({
      brand: 'triops',
      brandHref: '#view',
      items: [
        { text: 'View',   href: '#view',   active: route === 'view' },
        { text: 'Send',   href: '#send',   active: route === 'send' },
        { text: 'Status', href: '#status', active: route === 'status' },
        { text: 'Log out (demo)', href: '#logout' }
      ]
    }),
    { t: 'div', a: { class: 'bw_container', style: 'padding:1.25rem 0 3rem' }, c: [
      { t: 'div', a: { style: 'text-align:right;font-size:0.85rem;opacity:0.7;margin-bottom:0.75rem' }, c: [
        { t: 'a', a: { href: '#', onclick: function (e) { e.preventDefault(); bw.toggleThemeMode(); } }, c: 'light / dark' },
        { t: 'span', c: '  ·  triops ' + SITE.version }
      ]},
      body
    ]}
  ]};
}

// ---------------------------------------------------------------- views

function loginView() {
  bw.DOM('#app', { t: 'div', c: [
    banner(),
    { t: 'div', a: { class: 'bw_bccl_card', style: 'max-width:26rem;margin:3rem auto;padding:1.75rem' }, c: [
      { t: 'img', a: { src: '../assets/triops-logo.png', alt: 'triops', style: 'height:56px;margin-bottom:1.25rem' } },
      { t: 'p', a: { style: 'opacity:0.75;font-size:0.9rem' }, c: 'Any username and password will do.' },
      { t: 'p', c: [{ t: 'label', c: ['Username', { t: 'br' },
          { t: 'input', a: { class: 'bw_bccl_form_control', type: 'text', value: 'demo' } }] }] },
      { t: 'p', c: [{ t: 'label', c: ['Password', { t: 'br' },
          { t: 'input', a: { class: 'bw_bccl_form_control', type: 'password', value: 'demo' } }] }] },
      bw.makeButton({ text: 'Log in', variant: 'primary', onclick: function () {
        loggedIn = true;
        if (window.location.hash === '#logout') { window.location.hash = '#view'; }
        render();
      }})
    ]}
  ]});
}

function viewBody() {
  return { t: 'div', c: [
    { t: 'h1', a: { style: 'margin-top:0' }, c: 'Received' },
    { t: 'div', a: { style: 'display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem' }, c: [
      { t: 'span', a: { style: 'opacity:0.75' }, c: 'channel: lab' },
      bw.makeButton({ text: 'Simulate a packet', size: 'sm',
        onclick: function () { addEntry(); renderEntries(); } }),
      { t: 'label', a: { style: 'display:flex;gap:0.35rem;align-items:center' }, c: [
        { t: 'input', a: { type: 'checkbox', onchange: toggleAuto } },
        { t: 'span', c: 'auto (2s)' }
      ]}
    ]},
    { t: 'div', a: { id: 'entries' }, c: '' }
  ]};
}

function sendBody() {
  return { t: 'div', c: [
    { t: 'h1', a: { style: 'margin-top:0' }, c: 'Send test data' },
    { t: 'p', a: { class: 'triops-prose', style: 'opacity:0.85' },
      c: 'In the real thing this posts to the store. Here it just adds to the list — ' +
         'useful before the hardware exists, and for checking what the viewer does with ' +
         'a payload your parser would reject.' },
    { t: 'div', a: { class: 'bw_bccl_card', style: 'padding:1.25rem' }, c: [
      { t: 'p', c: [{ t: 'label', c: ['Channel', { t: 'br' },
          { t: 'input', a: { class: 'bw_bccl_form_control', type: 'text', value: 'lab' } }] }] },
      { t: 'p', c: [{ t: 'label', c: ['Payload', { t: 'br' },
          { t: 'textarea', a: { class: 'bw_bccl_form_control', id: 'payload', rows: 8,
              placeholder: '{"device":"esp32-01","temp_c":22.4}' } }] }] },
      bw.makeButton({ text: 'Send', variant: 'primary', onclick: function () {
        var el = document.getElementById('payload');
        var body = (el && el.value.trim()) || '{"device":"demo","temp_c":21.0}';
        addEntry({ body: body });
        window.location.hash = '#view';
      }})
    ]}
  ]};
}

function statusBody() {
  var total = entries.length;

  function row(label, value, bad) {
    return { t: 'tr', c: [
      { t: 'td', a: { style: 'padding:0.35rem 1rem 0.35rem 0;opacity:0.75;white-space:nowrap' }, c: label },
      { t: 'td', a: { style: 'font-family:monospace' + (bad ? ';color:#c0392b;font-weight:600' : '') }, c: String(value) }
    ]};
  }

  return { t: 'div', c: [
    { t: 'h1', a: { style: 'margin-top:0' }, c: 'Status' },
    { t: 'p', a: { class: 'triops-prose', style: 'opacity:0.85' },
      c: 'The first page to check when something is wrong. These numbers are made up; ' +
         'on a real install they come from the server.' },
    { t: 'div', a: { style: 'display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem' }, c: [
      bw.makeStatCard({ label: 'Store', value: 'sqlite' }),
      bw.makeStatCard({ label: 'Entries', value: total }),
      bw.makeStatCard({ label: 'Channels', value: 1 }),
      bw.makeStatCard({ label: 'Users', value: 1 })
    ]},
    bw.makeCard({ title: 'Environment', content: { t: 'table', c: { t: 'tbody', c: [
      row('triops', SITE.version),
      row('api', 1),
      row('php', '8.2.14'),
      row('bitwrench', SITE.bitwrench),
      row('store driver', 'sqlite'),
      row('store healthy', 'yes'),
      row('sqlite3 extension', 'present'),
      row('data dir writable', 'yes'),
      row('max entries / channel', 512),
      row('max payload bytes', 65536),
      row('ingest key', 'not set — anyone can post'),
      row('device TACO render', 'disabled')
    ]}}}),
    bw.makeCard({ title: 'Channels', content: bw.makeDataTable({
      data: [{ channel: 'lab', entries: total, last: entries.length ? triops.fmtAgo(entries[0].ts) : '—' }]
    })})
  ]};
}

// ---------------------------------------------------------------- render

function toggleAuto(e) {
  if (timer) { clearInterval(timer); timer = null; }
  if (e.target.checked) {
    timer = setInterval(function () { addEntry(); renderEntries(); }, 2000);
  }
}

function renderEntries() {
  bw.DOM('#entries', {
    t: 'div',
    c: entries.map(function (e) {
      var meta = [
        triops.fmtTime(e.ts) + ' (' + triops.fmtAgo(e.ts) + ')',
        e.method, e.ip, e.bytes + ' bytes', e.ctype || 'no content-type'
      ].join('  ·  ');

      // Same order as app/view.php: metadata, query, headers, payload. Keep
      // them in step — this page exists to show what you actually get.
      var body = [
        { t: 'div', a: { style: 'font-size:0.8rem;opacity:0.7;margin-bottom:0.4rem' }, c: meta }
      ];

      if (e.query && Object.keys(e.query).length) {
        body.push({ t: 'div', a: { style: 'margin-bottom:0.4rem' }, c: [
          { t: 'strong', c: 'query: ' }, triops.jsonTaco(e.query)
        ]});
      }

      if (e.headers && Object.keys(e.headers).length) {
        body.push({
          t: 'details',
          a: { style: 'margin-bottom:0.4rem' },
          c: [
            {
              t: 'summary',
              a: { style: 'cursor:pointer;font-size:0.85rem;opacity:0.8' },
              c: Object.keys(e.headers).length + ' headers'
            },
            { t: 'div', a: { style: 'margin-top:0.3rem' }, c: triops.jsonTaco(e.headers) }
          ]
        });
      }

      body.push(triops.payloadTaco(e.body, String(e.ts), expanded, e.body_encoding));

      return bw.makeCard({ content: { t: 'div', c: body } });
    })
  });
}

// Keep a toggled-open raw view open across re-renders, same as the real app.
var expanded = new Set();

function render() {
  // Leaving the page stops the timer; otherwise it keeps firing against a
  // #entries element that no longer exists.
  if (timer) { clearInterval(timer); timer = null; }

  if (window.location.hash === '#logout') { loggedIn = false; }
  if (!loggedIn) { loginView(); return; }

  var route = currentRoute();
  var body = route === 'send' ? sendBody() : route === 'status' ? statusBody() : viewBody();

  bw.DOM('#app', shell(route, body));
  if (route === 'view') renderEntries();
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
